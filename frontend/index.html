<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Earn'n'Pay</title>
    <!-- Minimal fallback styles in case Tailwind build/CSS fails to load in production -->
    <style>
      :root{ --bg:#0f1724; --muted:#94a3b8; --accent:#f59e0b; --card:#111827; --text:#f8fafc }
      html,body,#root{height:100%;}
      body{
        margin:0;
        background:var(--bg);
        color:var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }
      a{color:#60a5fa}
      .app-container{max-width:800px;margin:0 auto;padding:20px}
      .card{background:var(--card);padding:16px;border-radius:12px}
      .btn{display:inline-block;padding:8px 12px;background:var(--accent);color:#08111a;border-radius:8px;text-decoration:none}
      h1,h2{margin:8px 0}
      .muted{color:var(--muted)}
      /* small responsive tweaks */
      @media (max-width:520px){.app-container{padding:14px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
